name: CIT replication tests

on:
  push:
    paths:
      - 'CIT/**'
      - '.github/workflows/cit-tests.yml'
  pull_request:
    paths:
      - 'CIT/**'
      - '.github/workflows/cit-tests.yml'

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e 'CIT/python[dev]'
      - run: pytest -q CIT/python/tests

  julia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - uses: julia-actions/cache@v2
      - name: Run Julia tests
        shell: bash
        run: |
          set +e
          julia --project=CIT/julia -e 'using Pkg; Pkg.instantiate(); Pkg.test()' > /tmp/cit-julia.log 2>&1
          status=$?
          tail -n 120 /tmp/cit-julia.log
          exit $status
